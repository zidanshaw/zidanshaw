name: Update quote of the day

on:
  schedule:
    - cron: "5 17 * * *" # 00:05 WIB (UTC+7) every day

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - quotes.json
      - scripts/update_quote.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Pick today's quote
        run: python3 scripts/update_quote.py

      - name: Commit and push if README changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update quote of the day"
          git push

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <rect width="900" height="260" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="258" rx="18" fill="none" stroke="#30363d"/>
  <text x="450" y="62" text-anchor="middle" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">QUOTE OF THE WEEK</text>
  <text x="450" y="122" text-anchor="middle" fill="#f0f6fc" font-family="Georgia, Times New Roman, serif" font-size="25">“Imagination is more important than knowledge.”</text>
  <text x="450" y="168" text-anchor="middle" fill="#c9d1d9" font-family="Arial, Helvetica, sans-serif" font-size="16">— Albert Einstein</text>
  <text x="450" y="210" text-anchor="middle" fill="#6e7681" font-family="Arial, Helvetica, sans-serif" font-size="11">Interview with George Sylvester Viereck, 1929</text>
</svg>